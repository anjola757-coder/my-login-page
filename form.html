<body>
  <form class="login" action="nav.html" method="post">
    <i class="fa-solid fa-x"></i>
    <h1>Login Form</h1><br>
    <label for="email">Email or Phone</label><br>
    <input type="email" id="email" name="email" class="input1" required><br>
    <label for="password">Password</label><br>
    <input type="password" id="password" name="password" class="input2" required><br>
    <a href="nav.html">Forgot Password?</a><br>
    <button type="submit"><b>LOGIN</b></button>
    <p class="p">Not a member? Sign up now</p>
  </form>
